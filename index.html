<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informes — Southern Copper Argentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="wrap">
  <h1>Informes</h1>
  <p class="sub">Southern Copper Argentina S.R.L.</p>

  <div class="informes" id="informes"></div>
</div>

<script>
// Para sumar un informe nuevo: agregá una entrada acá y su carpeta al lado de las otras.
const INFORMES = [
  {
    titulo: "Balance de comprobación USD",
    descripcion: "Carga los saldos del mes en el balance maestro por centro de costo, " +
                 "inserta las cuentas nuevas en su lugar y reacomoda las fórmulas.",
    origen: "Export de Onvio",
    url: "informe-a/index.html",
  },
  {
    titulo: "BALCOMPROBDOLARES",
    descripcion: "Arma el balance de comprobación en dólares, clasifica las cuentas nuevas " +
                 "y corre la cascada de validación antes de generar el archivo.",
    origen: "Export de SISE",
    url: "informe-b/index.html",
  },
];

document.getElementById("informes").innerHTML = INFORMES.map(i => `
  <a class="informe-card" href="${i.url}">
    <h2>${i.titulo}</h2>
    <p>${i.descripcion}</p>
    <div class="origen">${i.origen}</div>
  </a>`).join("");
</script>
</body>
</html>
