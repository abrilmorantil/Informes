<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informes — Southern Copper Argentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=2026-09-02i">
</head>
<body>
<div class="wrap">
  <header class="portada">
    <div class="linea"></div>
    <span class="eyebrow">Southern Copper Argentina S.R.L.</span>
    <h1>Informes</h1>
    <p class="sub">
      Cada informe toma el export del sistema y arma el archivo del mes, con los controles
      de consistencia hechos antes de darlo por bueno.
    </p>
  </header>

  <div class="informes" id="informes"></div>
</div>

<script>
// Para sumar un informe nuevo: agregá una entrada acá y su carpeta al lado de las otras.
// El orden de esta lista es el que se ve en pantalla.
// `origen` dice EXACTAMENTE qué archivo hay que bajar del sistema. Es el dato que más se
// consulta y el más fácil de equivocar: los dos balances usan un Sumas y Saldos de Onvio,
// pero uno lo quiere por centro de costos y mensual, y el otro por código de cuenta y
// acumulado. Bajar el que no es da números que parecen razonables y están mal.
const INFORMES = [
  {
    titulo: "Asto",
    descripcion: "Arma el asiento de diferencia de cambio del cierre y el importador de Onvio.",
    origen: "Onvio › Sumas y Saldos bimonetario (pesos y dólares)",
    url: "informe-d/index.html",
  },
  {
    titulo: "Balance de comprobación por Centros de costos",
    descripcion: "Carga los saldos del mes en el balance maestro e inserta las cuentas nuevas.",
    origen: "Onvio › Sumas y Saldos por CENTRO DE COSTOS — del MES",
    url: "informe-a/index.html",
  },
  {
    titulo: "BALCOMPROBDOLARES",
    descripcion: "Arma el balance de comprobación en dólares y clasifica las cuentas nuevas.",
    origen: "Onvio › Sumas y Saldos",
    url: "informe-b/index.html",
  },
  {
    titulo: "Balance Pesos y Dólares + EE RR",
    descripcion: "Actualiza los dos balances formales y, en la misma corrida, el Estado de Resultados.",
    origen: "Onvio › Sumas y Saldos por CÓDIGO DE CUENTA — ACUMULADO del ejercicio",
    url: "informe-c/index.html",
  },
];

document.getElementById("informes").innerHTML = INFORMES.map((i, n) => `
  <a class="informe-card" href="${i.url}">
    <span class="indice">${String(n + 1).padStart(2, "0")}</span>
    <h2>${i.titulo}</h2>
    <p>${i.descripcion}</p>
    <div class="origen">
      <span>${i.origen}</span>
      <span class="flecha" aria-hidden="true">→</span>
    </div>
  </a>`).join("");
</script>
</body>
</html>
